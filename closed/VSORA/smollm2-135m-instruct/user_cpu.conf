# LoadGen overrides for SmolLM2-135M-Instruct on the CPU dev system (fp32, 16-thread Ryzen AI 7 PRO 350).
# Benchmark names are not in mlperf.conf, so '*' defaults apply to anything not set here.
# Re-measure and update target_qps whenever the machine, dtype, batch size or sample count changes.

# Token metrics, as mlperf.conf sets for the real LLM benchmarks. Offline: "Tokens per second" from the token
# counts the SUT returns. Server: the SUT also reports each sample's first token (lg.FirstTokenComplete), and
# validity is judged on TTFT/TPOT percentiles instead of target_latency.
*.*.use_token_latencies = 1

# smoke-tiny: ~8.5 samples/s Offline. 1.1 * 1 s * 12 = 13 samples -> ~1.5 s > min_duration.
smoke-tiny.Offline.target_qps = 12
smoke-tiny.Offline.min_query_count = 1
smoke-tiny.Offline.min_duration = 1000
smoke-tiny.Server.target_qps = 1
smoke-tiny.Server.ttft_latency = 2000
smoke-tiny.Server.tpot_latency = 200
smoke-tiny.Server.min_query_count = 16
smoke-tiny.Server.min_duration = 5000

# cnndm-smollm Offline: measured 0.20 samples/s. Offline issues ONE query of
# max(min_query_count, 1.1 * min_duration_s * target_qps) samples, so:
#   min_query_count = total_sample_count      -> every sample runs once (64)
#   target_qps      = measured throughput     -> 1.1 * 180 * 0.20 = 40 < 64, count stays 64
#   min_duration    < samples / qps           -> 64 / 0.20 = 320 s > 180 s, margin for variance
cnndm-smollm.Offline.target_qps = 0.20
cnndm-smollm.Offline.min_query_count = 64
cnndm-smollm.Offline.min_duration = 180000

# cnndm-smollm Server: queries run one at a time, so target_qps stays well under the Offline rate.
# TTFT/TPOT limits are llama2-70b's (mlperf.conf), lenient for a CPU. Early stopping needs ~460 in-limit
# queries for a VALID run (~40+ min here), so this short run is a functional check and reports INVALID.
cnndm-smollm.Server.target_qps = 0.1
cnndm-smollm.Server.ttft_latency = 2000
cnndm-smollm.Server.tpot_latency = 200
cnndm-smollm.Server.min_query_count = 32
cnndm-smollm.Server.min_duration = 120000
