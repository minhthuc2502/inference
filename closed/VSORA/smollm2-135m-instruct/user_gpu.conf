# LoadGen overrides for SmolLM2-135M-Instruct on an NVIDIA GPU dev system (vLLM, bf16).
# Benchmark names are not in mlperf.conf, so '*' defaults apply to anything not set here.
# target_qps values are starting points, NOT measured: run once, then set them from the reported samples/s.
*.*.use_token_latencies = 1

smoke-tiny.Offline.target_qps = 100
smoke-tiny.Offline.min_query_count = 1
smoke-tiny.Offline.min_duration = 1000
smoke-tiny.Server.target_qps = 10
smoke-tiny.Server.ttft_latency = 2000
smoke-tiny.Server.tpot_latency = 200
smoke-tiny.Server.min_query_count = 32
smoke-tiny.Server.min_duration = 5000

# cnndm-smollm: whole file, every sample runs once (see user_cpu.conf for the Offline sizing formula).
cnndm-smollm.Offline.target_qps = 50
cnndm-smollm.Offline.min_query_count = 13368
cnndm-smollm.Offline.min_duration = 60000

# TTFT/TPOT limits are llama2-70b's (mlperf.conf).
cnndm-smollm.Server.target_qps = 10
cnndm-smollm.Server.ttft_latency = 2000
cnndm-smollm.Server.tpot_latency = 200
cnndm-smollm.Server.min_query_count = 1000
cnndm-smollm.Server.min_duration = 120000
