[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vsora-mlperf"
version = "0.1.0"
description = "VSORA chip MLPerf Inference harness (closed-division style layout)"
requires-python = ">=3.10"
dependencies = ["numpy", "pyyaml", "pandas", "httpx"]

[project.scripts]
vsora-mlperf = "vsora_mlperf.harness.runner:main"

[tool.setuptools.packages.find]
where = ["src"]
